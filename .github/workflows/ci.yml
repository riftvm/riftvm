name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    name: Linux Agent tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: GuestAgent/linux/go.mod
          cache-dependency-path: GuestAgent/linux/go.sum
      - run: go test -race ./...
        working-directory: GuestAgent/linux
      - name: Check shell syntax
        run: |
          while IFS= read -r script; do bash -n "$script"; done < <(git ls-files 'scripts/*.sh')
  app-build:
    name: Xcode 27 compile checks
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check notarization receipt validation
        run: ruby scripts/test-notary-receipt.rb
      - name: Check read-only fixture guards
        run: bash scripts/test-readonly-fixture-guard.sh
      - name: Check CLI fixture cleanup safety
        run: bash scripts/test-cli-fixture-cleanup.sh
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build App and App tests
        run: |
          xcodebuild build-for-testing \
            -project RiftVM/RiftVM.xcodeproj -scheme RiftVM \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RiftVMDerived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Core and CLI tests
        run: swift build --build-tests
