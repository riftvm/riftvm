name: RiftVMOmarchy
options:
  bundleIdPrefix: com.everettjf
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  RiftVMCore:
    path: ..
targets:
  RiftVM Omarchy:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: RiftVMCore
        product: RiftVMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riftvm.app
        PRODUCT_NAME: RiftVM Omarchy
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YPV49M8592
        CODE_SIGN_ENTITLEMENTS: Resources/RiftVMOmarchy.entitlements
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RiftVM Omarchy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SWIFT_VERSION: 5.0
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - RiftVM OmarchyTests
  RiftVM OmarchyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: RiftVM Omarchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riftvm.app.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YPV49M8592
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
